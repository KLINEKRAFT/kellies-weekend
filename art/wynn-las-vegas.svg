<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Wynn Las Vegas — golden tower against dusk sky">
  <defs>
    <linearGradient id="wn-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2848"/>
      <stop offset=".3" stop-color="#7a4858"/>
      <stop offset=".6" stop-color="#d49858"/>
      <stop offset="1" stop-color="#f8c878"/>
    </linearGradient>
    <linearGradient id="wn-tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c89848"/>
      <stop offset=".5" stop-color="#a87830"/>
      <stop offset="1" stop-color="#785020"/>
    </linearGradient>
    <linearGradient id="wn-tower2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b88838"/>
      <stop offset="1" stop-color="#684020"/>
    </linearGradient>
    <pattern id="wn-windows" x="0" y="0" width="14" height="20" patternUnits="userSpaceOnUse">
      <rect width="14" height="20" fill="transparent"/>
      <rect x="2" y="3" width="10" height="14" fill="#f8d878" opacity=".55"/>
    </pattern>
  </defs>
  <rect width="800" height="1000" fill="url(#wn-sky)"/>
  <!-- distant tower -->
  <rect x="80" y="350" width="100" height="650" fill="url(#wn-tower2)" opacity=".7"/>
  <rect x="80" y="350" width="100" height="650" fill="url(#wn-windows)" opacity=".4"/>
  <!-- main tower -->
  <path d="M280 200 L520 200 L540 1000 L260 1000 Z" fill="url(#wn-tower)"/>
  <!-- tower windows -->
  <rect x="280" y="240" width="240" height="760" fill="url(#wn-windows)" opacity=".75"/>
  <!-- tower edge highlights -->
  <rect x="280" y="200" width="3" height="800" fill="#f8d878" opacity=".4"/>
  <rect x="517" y="200" width="3" height="800" fill="#3a2010" opacity=".5"/>
  <!-- tower crown -->
  <rect x="270" y="180" width="260" height="22" fill="#d8a850"/>
  <rect x="265" y="170" width="270" height="12" fill="#e8b860"/>
  <!-- spire -->
  <path d="M395 170 L405 170 L402 60 L400 50 L398 60 Z" fill="#f8d878"/>
  <!-- right tower -->
  <rect x="620" y="380" width="120" height="620" fill="url(#wn-tower2)" opacity=".85"/>
  <rect x="620" y="380" width="120" height="620" fill="url(#wn-windows)" opacity=".5"/>
  <!-- ground -->
  <rect y="950" width="800" height="50" fill="#1a1008"/>
  <!-- light glow on ground -->
  <ellipse cx="400" cy="960" rx="300" ry="20" fill="#f8d878" opacity=".25"/>
  <!-- a few stars -->
  <g fill="#f8f4ec" opacity=".7">
    <circle cx="120" cy="120" r="1.5"/>
    <circle cx="220" cy="80" r="1"/>
    <circle cx="640" cy="100" r="1.2"/>
    <circle cx="720" cy="150" r="1"/>
    <circle cx="60" cy="200" r="1"/>
  </g>
</svg>
