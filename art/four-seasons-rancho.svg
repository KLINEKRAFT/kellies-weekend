<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Four Seasons Rancho Encantado — high desert mesa at dusk">
  <defs>
    <linearGradient id="fs-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c8a8"/>
      <stop offset=".4" stop-color="#d9a07a"/>
      <stop offset=".75" stop-color="#a86e52"/>
      <stop offset="1" stop-color="#5e3d2e"/>
    </linearGradient>
    <linearGradient id="fs-fg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a20"/>
      <stop offset="1" stop-color="#1f1612"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#fs-sky)"/>
  <!-- sun -->
  <circle cx="400" cy="520" r="58" fill="#f8e3c0" opacity=".95"/>
  <circle cx="400" cy="520" r="120" fill="#f8e3c0" opacity=".15"/>
  <!-- distant mesa -->
  <path d="M0 600 L120 600 L130 580 L260 580 L268 600 L420 600 L432 575 L560 575 L568 600 L800 600 L800 700 L0 700Z" fill="#7a5340" opacity=".7"/>
  <!-- mid mesa -->
  <path d="M0 660 L80 660 L92 632 L240 632 L250 660 L380 660 L390 620 L520 620 L530 660 L640 660 L650 644 L800 644 L800 760 L0 760Z" fill="#5a3826" opacity=".85"/>
  <!-- foreground -->
  <path d="M0 760 L0 1000 L800 1000 L800 740 L680 740 L668 720 L520 720 L508 750 L350 750 L342 730 L180 730 L168 760Z" fill="url(#fs-fg)"/>
  <!-- adobe casita -->
  <g transform="translate(290 760)" fill="#2a1810">
    <rect width="220" height="100" fill="#3d2418"/>
    <rect x="20" y="30" width="34" height="50" fill="#0a0604"/>
    <rect x="80" y="30" width="34" height="50" fill="#0a0604"/>
    <rect x="140" y="30" width="34" height="50" fill="#0a0604"/>
    <!-- vigas -->
    <rect x="-4" y="-8" width="228" height="10" fill="#4a2d1e"/>
    <circle cx="20" cy="-3" r="4" fill="#1a0d08"/>
    <circle cx="60" cy="-3" r="4" fill="#1a0d08"/>
    <circle cx="100" cy="-3" r="4" fill="#1a0d08"/>
    <circle cx="140" cy="-3" r="4" fill="#1a0d08"/>
    <circle cx="180" cy="-3" r="4" fill="#1a0d08"/>
  </g>
  <!-- piñon trees -->
  <g fill="#1a0e08">
    <ellipse cx="120" cy="820" rx="32" ry="22"/>
    <rect x="116" y="820" width="8" height="20"/>
    <ellipse cx="180" cy="840" rx="28" ry="18"/>
    <rect x="176" y="840" width="6" height="18"/>
    <ellipse cx="640" cy="830" rx="36" ry="24"/>
    <rect x="636" y="830" width="8" height="22"/>
    <ellipse cx="700" cy="850" rx="26" ry="18"/>
    <rect x="697" y="850" width="6" height="16"/>
  </g>
</svg>
