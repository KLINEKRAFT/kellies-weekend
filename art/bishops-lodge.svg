<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Bishop's Lodge — historic chapel in the piñon foothills above Santa Fe">
  <defs>
    <linearGradient id="bl-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfd4c8"/>
      <stop offset=".4" stop-color="#e0d6c0"/>
      <stop offset=".8" stop-color="#d4b890"/>
      <stop offset="1" stop-color="#a08868"/>
    </linearGradient>
    <linearGradient id="bl-fg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e6b59"/>
      <stop offset="1" stop-color="#2e3a2c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bl-sky)"/>
  <!-- soft sun -->
  <circle cx="200" cy="240" r="44" fill="#f4e4c4" opacity=".85"/>
  <circle cx="200" cy="240" r="100" fill="#f4e4c4" opacity=".18"/>
  <!-- distant Sangre de Cristo ridge -->
  <path d="M0 540 L80 510 L160 530 L240 495 L340 520 L440 490 L540 515 L640 488 L740 510 L800 498 L800 660 L0 660Z" fill="#8a8878" opacity=".7"/>
  <!-- mid foothills -->
  <path d="M0 600 L100 555 L200 590 L320 540 L440 580 L560 535 L680 575 L800 550 L800 720 L0 720Z" fill="#6e7460" opacity=".88"/>
  <!-- foreground hills with piñon dotting -->
  <path d="M0 700 L120 640 L240 690 L380 620 L520 685 L660 625 L800 670 L800 1000 L0 1000Z" fill="url(#bl-fg)"/>
  <!-- piñon-juniper dots -->
  <g fill="#1f2a1d" opacity=".75">
    <circle cx="60" cy="730" r="9"/><circle cx="105" cy="745" r="7"/>
    <circle cx="150" cy="725" r="10"/><circle cx="200" cy="755" r="8"/>
    <circle cx="265" cy="740" r="9"/><circle cx="320" cy="720" r="11"/>
    <circle cx="380" cy="745" r="8"/><circle cx="440" cy="730" r="9"/>
    <circle cx="500" cy="755" r="7"/><circle cx="560" cy="735" r="10"/>
    <circle cx="620" cy="755" r="8"/><circle cx="680" cy="740" r="9"/>
    <circle cx="740" cy="730" r="11"/><circle cx="780" cy="755" r="7"/>
    <circle cx="90" cy="800" r="11"/><circle cx="180" cy="820" r="9"/>
    <circle cx="290" cy="810" r="10"/><circle cx="420" cy="825" r="8"/>
    <circle cx="540" cy="815" r="11"/><circle cx="660" cy="820" r="9"/>
    <circle cx="730" cy="805" r="10"/>
  </g>
  <!-- historic chapel silhouette, centered -->
  <g transform="translate(340 580)">
    <!-- nave -->
    <rect x="0" y="40" width="120" height="70" fill="#2a2018"/>
    <!-- tower base -->
    <rect x="48" y="0" width="24" height="110" fill="#2a2018"/>
    <!-- bell housing -->
    <rect x="44" y="-14" width="32" height="14" fill="#3a2c20"/>
    <!-- pitched roof on nave -->
    <path d="M-6 40 L60 14 L126 40 Z" fill="#1a1410"/>
    <!-- tower roof -->
    <path d="M44 -14 L60 -34 L76 -14 Z" fill="#1a1410"/>
    <!-- cross -->
    <rect x="59" y="-46" width="2" height="14" fill="#1a1410"/>
    <rect x="55" y="-42" width="10" height="2" fill="#1a1410"/>
    <!-- arched door glow -->
    <path d="M52 70 L52 95 Q52 60 60 60 Q68 60 68 95 L68 70 Z" fill="#f4d488"/>
    <!-- small windows -->
    <rect x="14" y="60" width="8" height="14" fill="#f4d488" opacity=".75"/>
    <rect x="30" y="60" width="8" height="14" fill="#f4d488" opacity=".75"/>
    <rect x="82" y="60" width="8" height="14" fill="#f4d488" opacity=".75"/>
    <rect x="98" y="60" width="8" height="14" fill="#f4d488" opacity=".75"/>
  </g>
  <!-- soft chapel light glow -->
  <circle cx="400" cy="650" r="120" fill="#f4d488" opacity=".07"/>
</svg>
