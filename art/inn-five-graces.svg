<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Inn of the Five Graces — adobe arch with mosaic tile work">
  <defs>
    <linearGradient id="ig-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c89a"/>
      <stop offset=".5" stop-color="#d4a878"/>
      <stop offset="1" stop-color="#a8794d"/>
    </linearGradient>
    <linearGradient id="ig-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c89870"/>
      <stop offset="1" stop-color="#9a6e48"/>
    </linearGradient>
    <pattern id="mosaic" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="#5a4a38"/>
      <rect x="1" y="1" width="13" height="13" fill="#8a9785"/>
      <rect x="16" y="1" width="13" height="13" fill="#c89870"/>
      <rect x="1" y="16" width="13" height="13" fill="#3a5050"/>
      <rect x="16" y="16" width="13" height="13" fill="#8a3838"/>
      <circle cx="7.5" cy="7.5" r="2.5" fill="#f1ebe0" opacity=".5"/>
      <circle cx="22.5" cy="22.5" r="2.5" fill="#f1ebe0" opacity=".5"/>
    </pattern>
  </defs>
  <rect width="800" height="1000" fill="url(#ig-bg)"/>
  <!-- sky/light beyond -->
  <rect width="800" height="1000" fill="url(#ig-wall)"/>
  <!-- archway opening showing courtyard beyond -->
  <path d="M0 0 L0 1000 L800 1000 L800 0 Z M250 250 L250 750 Q250 200 400 200 Q550 200 550 750 L550 250 Z" fill="url(#ig-wall)" fill-rule="evenodd"/>
  <!-- arch interior - sunlit courtyard -->
  <path d="M250 750 L250 250 Q250 200 400 200 Q550 200 550 250 L550 750 Z" fill="#f1d8a8"/>
  <path d="M250 750 L250 250 Q250 200 400 200 Q550 200 550 250 L550 750 Z" fill="url(#ig-bg)" opacity=".4"/>
  <!-- arch shadow line -->
  <path d="M250 250 Q250 200 400 200 Q550 200 550 250" fill="none" stroke="#5a4030" stroke-width="3" opacity=".4"/>
  <!-- inner arch detail (silhouette of door) -->
  <path d="M340 750 L340 480 Q340 440 400 440 Q460 440 460 480 L460 750 Z" fill="#3a2418"/>
  <line x1="400" y1="440" x2="400" y2="750" stroke="#1a0e08" stroke-width="1.5"/>
  <!-- handle dots -->
  <circle cx="375" cy="600" r="4" fill="#9a7848"/>
  <circle cx="425" cy="600" r="4" fill="#9a7848"/>
  <!-- mosaic band base -->
  <rect y="780" width="800" height="60" fill="url(#mosaic)"/>
  <rect y="775" width="800" height="3" fill="#3a2818" opacity=".6"/>
  <rect y="840" width="800" height="3" fill="#3a2818" opacity=".6"/>
  <!-- floor -->
  <rect y="843" width="800" height="157" fill="#7a5530"/>
  <rect y="843" width="800" height="157" fill="#3a2418" opacity=".3"/>
  <!-- floor planks -->
  <g stroke="#3a2418" stroke-width="1" opacity=".3">
    <line x1="0" y1="900" x2="800" y2="900"/>
    <line x1="0" y1="950" x2="800" y2="950"/>
  </g>
  <!-- lantern hanging -->
  <line x1="400" y1="200" x2="400" y2="280" stroke="#3a2418" stroke-width="2"/>
  <rect x="380" y="280" width="40" height="55" fill="#3a2418"/>
  <rect x="384" y="285" width="32" height="45" fill="#f8d878"/>
  <rect x="384" y="285" width="32" height="45" fill="#f8d878" opacity=".6"/>
  <line x1="384" y1="295" x2="416" y2="295" stroke="#3a2418" stroke-width=".5"/>
  <line x1="384" y1="310" x2="416" y2="310" stroke="#3a2418" stroke-width=".5"/>
  <line x1="384" y1="325" x2="416" y2="325" stroke="#3a2418" stroke-width=".5"/>
  <!-- lantern glow -->
  <circle cx="400" cy="307" r="80" fill="#f8d878" opacity=".15"/>
</svg>
