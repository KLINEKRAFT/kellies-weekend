<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ten Thousand Waves — onsen ripples in pine forest at dusk">
  <defs>
    <linearGradient id="tw-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2823"/>
      <stop offset=".55" stop-color="#3d342b"/>
      <stop offset="1" stop-color="#5a4a3a"/>
    </linearGradient>
    <radialGradient id="tw-moon" cx=".7" cy=".22" r=".18">
      <stop offset="0" stop-color="#f8f4ec" stop-opacity=".95"/>
      <stop offset=".6" stop-color="#f8f4ec" stop-opacity=".25"/>
      <stop offset="1" stop-color="#f8f4ec" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tw-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1814"/>
      <stop offset="1" stop-color="#0d0c0a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#tw-sky)"/>
  <circle cx="560" cy="220" r="160" fill="url(#tw-moon)"/>
  <circle cx="560" cy="220" r="46" fill="#f1ebe0" opacity=".85"/>
  <!-- pine silhouettes -->
  <g fill="#1a1814" opacity=".9">
    <path d="M0 720 L60 540 L72 720Z"/>
    <path d="M50 720 L120 480 L140 720Z"/>
    <path d="M120 720 L200 510 L220 720Z"/>
    <path d="M620 720 L680 530 L700 720Z"/>
    <path d="M690 720 L760 470 L800 720Z M760 720 L800 540 L800 720Z"/>
  </g>
  <!-- water -->
  <rect y="700" width="800" height="300" fill="url(#tw-water)"/>
  <!-- ripples -->
  <g fill="none" stroke="#c8d0c0" stroke-opacity=".4" stroke-width="1.2">
    <ellipse cx="400" cy="820" rx="60" ry="10"/>
    <ellipse cx="400" cy="820" rx="120" ry="20"/>
    <ellipse cx="400" cy="820" rx="200" ry="32"/>
    <ellipse cx="400" cy="820" rx="290" ry="48"/>
    <ellipse cx="400" cy="820" rx="390" ry="65"/>
  </g>
  <g fill="none" stroke="#f8f4ec" stroke-opacity=".15" stroke-width="1">
    <ellipse cx="400" cy="820" rx="80" ry="13"/>
    <ellipse cx="400" cy="820" rx="160" ry="26"/>
    <ellipse cx="400" cy="820" rx="240" ry="40"/>
  </g>
  <!-- moon reflection -->
  <ellipse cx="400" cy="820" rx="14" ry="2.5" fill="#f1ebe0" opacity=".7"/>
  <ellipse cx="400" cy="850" rx="22" ry="3" fill="#f1ebe0" opacity=".4"/>
  <ellipse cx="400" cy="880" rx="32" ry="3.5" fill="#f1ebe0" opacity=".25"/>
</svg>
