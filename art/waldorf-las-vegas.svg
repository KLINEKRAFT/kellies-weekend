<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Waldorf Astoria Las Vegas — view of the Strip from above">
  <defs>
    <linearGradient id="wl-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1828"/>
      <stop offset=".4" stop-color="#3a2848"/>
      <stop offset=".75" stop-color="#7a4858"/>
      <stop offset="1" stop-color="#c87848"/>
    </linearGradient>
    <linearGradient id="wl-window" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a1820"/>
      <stop offset=".05" stop-color="#5a4858"/>
      <stop offset=".5" stop-color="transparent"/>
      <stop offset=".95" stop-color="#5a4858"/>
      <stop offset="1" stop-color="#1a1820"/>
    </linearGradient>
    <pattern id="wl-bld-windows" x="0" y="0" width="10" height="14" patternUnits="userSpaceOnUse">
      <rect width="10" height="14" fill="transparent"/>
      <rect x="1" y="2" width="8" height="10" fill="#f8d878" opacity=".7"/>
    </pattern>
    <pattern id="wl-bld-windows-dim" x="0" y="0" width="10" height="14" patternUnits="userSpaceOnUse">
      <rect width="10" height="14" fill="transparent"/>
      <rect x="1" y="2" width="8" height="10" fill="#d8a868" opacity=".4"/>
    </pattern>
  </defs>
  <rect width="800" height="1000" fill="url(#wl-sky)"/>
  <!-- room frame top - viewing through suite window -->
  <rect width="800" height="40" fill="#1a1410"/>
  <!-- distant mountains -->
  <path d="M0 580 L80 540 L180 570 L280 530 L380 565 L480 525 L580 555 L700 530 L800 560 L800 620 L0 620Z" fill="#3a2838" opacity=".7"/>
  <!-- skyline back row -->
  <g>
    <rect x="40" y="540" width="50" height="180" fill="#2a2030"/>
    <rect x="40" y="540" width="50" height="180" fill="url(#wl-bld-windows-dim)"/>
    <rect x="100" y="500" width="60" height="220" fill="#2a2030"/>
    <rect x="100" y="500" width="60" height="220" fill="url(#wl-bld-windows-dim)"/>
    <rect x="170" y="560" width="40" height="160" fill="#2a2030"/>
    <rect x="220" y="480" width="55" height="240" fill="#2a2030"/>
    <rect x="220" y="480" width="55" height="240" fill="url(#wl-bld-windows-dim)"/>
    <rect x="285" y="520" width="48" height="200" fill="#2a2030"/>
    <rect x="345" y="490" width="60" height="230" fill="#2a2030"/>
    <rect x="345" y="490" width="60" height="230" fill="url(#wl-bld-windows-dim)"/>
    <rect x="415" y="540" width="42" height="180" fill="#2a2030"/>
    <rect x="465" y="510" width="50" height="210" fill="#2a2030"/>
    <rect x="465" y="510" width="50" height="210" fill="url(#wl-bld-windows-dim)"/>
    <rect x="525" y="540" width="55" height="180" fill="#2a2030"/>
    <rect x="590" y="500" width="60" height="220" fill="#2a2030"/>
    <rect x="590" y="500" width="60" height="220" fill="url(#wl-bld-windows-dim)"/>
    <rect x="660" y="540" width="48" height="180" fill="#2a2030"/>
    <rect x="715" y="520" width="58" height="200" fill="#2a2030"/>
    <rect x="715" y="520" width="58" height="200" fill="url(#wl-bld-windows-dim)"/>
  </g>
  <!-- skyline mid row (more lit, the Strip) -->
  <g>
    <rect x="0" y="600" width="80" height="120" fill="#1a1820"/>
    <rect x="0" y="600" width="80" height="120" fill="url(#wl-bld-windows)"/>
    <rect x="90" y="560" width="100" height="160" fill="#1a1820"/>
    <rect x="90" y="560" width="100" height="160" fill="url(#wl-bld-windows)"/>
    <!-- Eiffel-style tower silhouette -->
    <path d="M220 720 L240 720 L242 660 L260 660 L262 720 L290 720 L290 700 L268 700 L266 640 L256 460 L246 460 L240 640 L218 700 L218 720Z" fill="#1a1410"/>
    <circle cx="251" cy="475" r="3" fill="#f8d878" opacity=".9"/>
    <rect x="310" y="540" width="120" height="180" fill="#1a1820"/>
    <rect x="310" y="540" width="120" height="180" fill="url(#wl-bld-windows)"/>
    <!-- pyramid/luxor-ish -->
    <path d="M450 720 L520 580 L590 720 Z" fill="#1a1410"/>
    <rect x="600" y="600" width="80" height="120" fill="#1a1820"/>
    <rect x="600" y="600" width="80" height="120" fill="url(#wl-bld-windows)"/>
    <rect x="690" y="540" width="110" height="180" fill="#1a1820"/>
    <rect x="690" y="540" width="110" height="180" fill="url(#wl-bld-windows)"/>
  </g>
  <!-- street level glow -->
  <rect y="720" width="800" height="180" fill="#0a0608"/>
  <ellipse cx="400" cy="730" rx="500" ry="40" fill="#f8c878" opacity=".15"/>
  <!-- street lights -->
  <g fill="#f8d878" opacity=".9">
    <circle cx="100" cy="730" r="2.5"/>
    <circle cx="180" cy="730" r="2.5"/>
    <circle cx="260" cy="730" r="2.5"/>
    <circle cx="340" cy="730" r="2.5"/>
    <circle cx="420" cy="730" r="2.5"/>
    <circle cx="500" cy="730" r="2.5"/>
    <circle cx="580" cy="730" r="2.5"/>
    <circle cx="660" cy="730" r="2.5"/>
    <circle cx="740" cy="730" r="2.5"/>
  </g>
  <!-- foreground: window reflection / room edge -->
  <rect y="900" width="800" height="100" fill="#0a0808"/>
  <rect y="895" width="800" height="6" fill="#3a2820" opacity=".8"/>
  <!-- subtle window mullions -->
  <line x1="266" y1="40" x2="266" y2="900" stroke="#1a1410" stroke-width="2" opacity=".4"/>
  <line x1="533" y1="40" x2="533" y2="900" stroke="#1a1410" stroke-width="2" opacity=".4"/>
</svg>
